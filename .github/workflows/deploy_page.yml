name: Deploy
on:
  push:

jobs:
  build:
    name: Deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v2

      - name: Install pandoc
        # The `-l` is needed so conda environment activation works correctly
        shell: bash -l {0}
        run: |
          wget -O pandoc-3.9.0.2-1-amd64.deb https://github.com/jgm/pandoc/releases/download/3.9.0.2/pandoc-3.9.0.2-1-amd64.deb
          sudo dpkg -i pandoc-3.9.0.2-1-amd64.deb
          pandoc --version

      # CONDA_PYTHON_EXE: /usr/share/miniconda/bin/python
      # 使用的是 /usr/local/lib/python3.13/site-packages
      - name: Build
        uses: OpenHUTB/actions-mkdocs@main
        with:
          mkdocs_version: 'latest'
          requirements: 'docs/requirements.txt'
          configfile: 'mkdocs.yml'

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
